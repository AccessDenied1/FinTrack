name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.2.0) — used only for manual dispatch"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build release AAB + APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { java-version: "17", distribution: "temurin" }

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run tests (gate)
        run: ./gradlew testDebugUnitTest --no-daemon

      # Unsigned for open-source CI. For Play, add signingConfigs with
      # FINTRACK_KEYSTORE_* secrets and switch to bundleRelease.
      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      - name: Build release Bundle
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: FinTrack-release-${{ github.ref_name }}-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: FinTrack-release-${{ github.ref_name }}-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-release]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: FinTrack-release-${{ github.ref_name }}-apk
          path: ./artifacts/apk

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: FinTrack-release-${{ github.ref_name }}-aab
          path: ./artifacts/aab

      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then RANGE="HEAD"; else RANGE="$PREV..HEAD"; fi
          echo "range=$RANGE" >> $GITHUB_OUTPUT
          echo "## What's changed" > /tmp/notes.md
          git log $RANGE --pretty=format:"- %s (%an)" >> /tmp/notes.md
          echo "" >> /tmp/notes.md
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/apk/app-release-unsigned.apk
            artifacts/aab/app-release.aab
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: true
