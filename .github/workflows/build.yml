name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Tier 1: fast unit — every push to dev/main + every PR (dev/main)
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: "17", distribution: "temurin" }
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

  # Tier 2: integration (Room in-mem, migrations) — PRs only
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: "17", distribution: "temurin" }
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew
      - name: Run integration tests (migrations + repository)
        run: ./gradlew :core:database:testDebugUnitTest :core:data:testDebugUnitTest --no-daemon

  # Tier 3: full — PR → main and push → main only (lint + UI + coverage + debug)
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: "17", distribution: "temurin" }
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew
      - run: ./gradlew lintDebug --no-daemon

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: "17", distribution: "temurin" }
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew
      - name: Run Compose UI tests
        run: ./gradlew :core:ui:testDebugUnitTest :feature:home:testDebugUnitTest --no-daemon

  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: "17", distribution: "temurin" }
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FinTrack-debug-${{ github.ref_name }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
